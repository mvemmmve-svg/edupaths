name: edupaths
description: Discover your future. Plan your path. Achieve your goals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Required for usePathUrlStrategy() — without it Flutter web uses /#/ hash
  # URLs, and with it clean paths need the Netlify SPA rewrite. See
  # lib/core/router/app_router.dart.
  flutter_web_plugins:
    sdk: flutter

  # Provides Nunito and all other fonts used throughout the app.
  # All fontFamily: 'Nunito' references in the code use this package.
  google_fonts: ^6.1.0

  url_launcher: ^6.2.5
  http: ^1.2.0
  supabase_flutter: 1.10.25
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  shared_preferences: ^2.2.3
  percent_indicator: ^4.2.3

dependency_overrides:
  app_links: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
