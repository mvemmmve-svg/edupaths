<!DOCTYPE html>
<html>
<head>
  <!--
    EduPaths — web/index.html
    
    CACHE BUSTING: The number after ?v= below must be incremented each time
    you deploy. Just add 1 to it. e.g. 1001 → 1002 → 1003
    This forces all browsers worldwide to fetch the latest version.
    Saved passwords live in the browser's credential manager — never affected.
    
    Current version: 1001  ← change this number on every deploy
  -->
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EduPaths — Compare university and apprenticeship pathways for UK students.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EduPaths">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#5B4FE9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPaths — Discover Your Future Career</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // ── Service Worker ────────────────────────────────────────────────────────
    // Registers with a version query string so browsers always pick up updates.
    // Saved passwords are stored in the browser's credential manager (separate
    // from this cache) — they are never touched by service worker updates.
    var BUILD_VERSION = '1001'; // ← keep in sync with the number in the comment above

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(
        'flutter_service_worker.js?v=' + BUILD_VERSION,
        { scope: '/' }
      ).then(function(reg) {
        // Activate any waiting worker immediately
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          }
        });
      });

      // When new service worker takes control, reload once to get fresh assets
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>

  <script>
    // ── Flutter bootstrap ─────────────────────────────────────────────────────
    var BUILD_VERSION = '1001'; // ← same number as above

    window.addEventListener('load', function() {
      var script = document.createElement('script');
      script.src = 'flutter.js?v=' + BUILD_VERSION;
      script.defer = true;
      script.onload = function() {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: BUILD_VERSION,
          },
          onEntrypointLoaded: async function(engineInitializer) {
            let appRunner = await engineInitializer.initializeEngine();
            await appRunner.runApp();
          }
        });
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
